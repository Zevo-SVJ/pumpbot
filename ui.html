.hero{position:relative;height:184px;border-radius:22px;overflow:hidden;color:#fff;
 background:radial-gradient(120% 95% at 8% 22%,#6b3212 0%,#3a1a0a 28%,#140905 55%,#060606 80%);box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* emotions */
.happy .o,.sad .o{opacity:0;transform:scaleY(.2)}

.sad .s{opacity:1;transform:rotate(24deg) scale(1)}.sad .face{transform:translateY(8px)}

.happy .eye.l,.happy .eye.r{transform:rotate(-10deg)}

.t .p{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}.t .p b{font-size:17px;color:#1e9e55;font-weight:800;letter-spacing:-.4px}

.open .bub{white-space:normal}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:#999;margin:0 1.5px;animation:ty 1s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-3px);opacity:.4}}
.hint{font-size:9.5px;color:#aaa;text-align:center;margin-top:6px}
/* nav */

nav div{text-align:center;width:56px}nav svg{width:23px;height:23px;display:block;margin:0 auto 3px}nav .on{color:#111;font-weight:700}
nav .sim{width:auto;background:#ff5a1f;color:#fff;font-weight:800;font-size:15px;padding:12px 23px;border-radius:24px;box-shadow:0 4px 12px rgba(255,90,31,.3)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<div class=hero><div class=blob id=mascot><div class=body></div><div class=face>
 <div class="eye l"><i class=o></i><i class=h></i><i class=s></i></div><div class="eye r"><i class=o></i><i class=h></i><i class=s></i></div>
 <div class="brow l"></div><div class="brow r"></div></div></div>

<div><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6><rect x=3.5 y=3.5 width=7 height=7 rx=2.2 /><rect x=13.5 y=3.5 width=7 height=7 rx=2.2 /><rect x=3.5 y=13.5 width=7 height=7 rx=2.2 /><rect x=13.5 y=13.5 width=7 height=7 rx=2.2 /></svg>Trades</div>

<div><svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6><circle cx=12 cy=8 r=4 /><path d="M4 21c.8-4.5 4-6.5 8-6.5s7.2 2 8 6.5"/></svg>Me</div></nav>
<canvas id=cf></canvas>
<script>
const Q=new URLSearchParams(location.search),FORCE=Q.get('emotion'),RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const C={Scout:'#ff6a1f',Sniper:'#3b82f6',Curve:'#16a37a',Graduate:'#8b6cf0'},AVC=['#f9a8d4','#fde047','#f9a8d4','#fb8f7e','#c4b5fd','#fdba74','#93c5fd','#fcd34d','#fdba74'];
const f=(v,d=0)=>(v<0?'-':'+')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[<&]/g,c=>c=='<'?'&lt;':'&amp;');
let cur=null,seen=new Set(),chatSeen=new Set(),first=true,lastClosed=null,lastPos=null,mood={e:'neutral',until:0},after=null,confDone=false,open=false;
function tween(el,from,to,fmt){if(RM||from===null){el.textContent=fmt(to);return}const t0=performance.now();
 (function s(n){const k=Math.min(1,(n-t0)/900),v=from+(to-from)*(1-Math.pow(1-k,3));el.textContent=fmt(v);if(k<1)requestAnimationFrame(s)})(t0)}
function setEmo(e){const m=$('mascot').parentNode;['neutral','happy','hesitant','focused','sad','excited'].forEach(x=>m.classList.toggle(x,x==e))}
function react(e,ms,next){mood={e,until:Date.now()+ms};after=next||null}
function emotion(d){if(FORCE)return setEmo(FORCE);
 const ck=d.closedT[0]?d.closedT[0].sym+d.closedT[0].pnl:null;
 if(lastClosed!==null&&ck&&ck!==lastClosed){const w=d.closedT[0].pnl>0;w?react('happy',7000):react('sad',6000,{e:'focused',ms:25000})}
 if(lastPos!==null&&d.pos.length>lastPos)react('excited',3000);
 lastClosed=ck;lastPos=d.pos.length;
 if(Date.now()>mood.until&&after){mood={e:after.e,until:Date.now()+after.ms};after=null}
 let e=mood.e;if(Date.now()>mood.until){e=d.pos.length&&d.pos.every(p=>Math.abs(p.ch)<.03)?'hesitant':'neutral'}
 setEmo(e)}
function draw(d){const m=d.equity/d.start,pf=cur;cur=d.profit;
 tween($('profit'),pf,d.profit,v=>f(v,Math.abs(v)<100?2:0));$('profit').className='big'+(d.profit<0?' neg':'');
 $('sol').textContent=(d.profit>=0?'+':'')+(d.sol?d.profit/d.sol:0).toFixed(2)+' SOL';$('mult').textContent=m.toFixed(2)+'×';
 $('tw').textContent=`${d.trades} trades · ${d.closed?Math.round(d.wins/d.closed*100):0}% win`;
 const g=Math.max(0,Math.min(1,(m-1)/4)),done=m>=5;$('gb').style.transform=`scaleX(${Math.max(g,.02)})`;
 $('bar').classList.toggle('done',done);$('goal').classList.toggle('done',done);$('goal').textContent=done?'goal 5× ✓':'goal 5×';
 if(done&&!confDone){confDone=true;confetti()}
 const A=Object.keys(C),tot=A.reduce((s,a)=>s+Math.max(0,d.agents[a]),0);
 $('seg').innerHTML=A.map(a=>`<i style="background:${C[a]};flex:${tot<0.01?1:Math.max(Math.max(0,d.agents[a])/tot,.06)} 1 0"></i>`).join('');
 $('leg').innerHTML=A.map(a=>`<span><span class=dot style="background:${C[a]}"></span>${a=='Scout'?'Test Scout':a} <b>${f(d.agents[a])}</b></span>`).join('');
 $('tot').textContent=d.closed+' total';
 $('grid').innerHTML=d.closedT.slice(0,9).map((t,i)=>{const k=t.sym+t.pnl.toFixed(4),nw=!seen.has(k)&&!first;seen.add(k);
  return `<div class="t${t.pnl<0?' l':''}${i==0&&t.pnl>=0?' first':''}" style="border-color:${C[t.agent]};${nw?'':'animation:none'}"><div class=n><span class=av style="background:${AVC[(t.sym.charCodeAt(0)||0)%9]}">${esc((t.sym[0]||'?').toUpperCase())}</span>$${esc(t.sym.toUpperCase())}</div><div class=p><b>${t.pct>=0?'+':''}${t.pct.toFixed(0)}%</b><span>${f(t.pnl)}</span></div></div>`}).join('')||'<div class=empty>No closed trades yet — agents are scanning launches…</div>';
 $('posc').style.display=d.pos.length?'':'none';$('pn').textContent=d.pos.length+' open';
 $('pos').innerHTML=d.pos.map(p=>`<div class=pos><span><span class=dot style="background:${C[p.agent]}"></span>$${esc(p.sym.toUpperCase())} · ${p.agent}</span><span class=mono style="color:${p.ch>=0?'#1e9e55':'#e05252'}">${(p.ch*100).toFixed(1)}% · $${p.cost.toFixed(0)}</span></div>`).join('');
 const msgs=d.chat.slice(0,open?12:4).reverse();
 $('chat').innerHTML=(msgs.map(c=>{const k=c.t+c.m,nw=!chatSeen.has(k)&&!first;chatSeen.add(k);const cls=C[c.a]?'':c.a=='me'?' me':' bot';
  return `<div class="bub${cls}" style="--c:${C[c.a]||'#ccc'};${nw?'':'animation:none'}">${esc(c.m)}</div>`}).join('')||'<div class=bub style="--c:#ccc">scanning new pump.fun launches…</div>')
  +'<div class="bub typing" style="--c:#ccc;animation:none"><span></span><span></span><span></span></div>'+(open?'<div class=hint>tap to collapse</div>':'');
 if(open){const c=$('chat');c.scrollTop=c.scrollHeight}
 emotion(d);first=false}
// chat expand / collapse
$('chatc').onclick=()=>{const c=$('chatc'),r0=c.getBoundingClientRect(),gt=$('grid').getBoundingClientRect().top-8;
 if(!open){open=true;const top=Math.max(8,gt);c.style.top=top+'px';c.classList.add('open');
  const ph=document.createElement('div');ph.id='ph';ph.style.height=r0.height+'px';ph.style.marginTop='8px';c.after(ph);
  const d=Math.max(0,r0.top-top);c.style.clipPath=`inset(${d}px 0 0 0 round 16px)`;c.offsetHeight;c.style.clipPath='inset(0 0 0 0 round 16px)';
  if(window.__d)draw(window.__d)}
 else{const ph=$('ph'),pr=ph.getBoundingClientRect(),d=Math.max(0,pr.top-r0.top);c.style.clipPath=`inset(${d}px 0 0 0 round 16px)`;
  setTimeout(()=>{open=false;c.classList.remove('open');c.style.clipPath='';c.style.top='';ph.remove();if(window.__d)draw(window.__d)},RM?0:420)}};
function confetti(){if(RM)return;const cv=$('cf'),x=cv.getContext('2d'),W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
 const cols=['#ff6a1f','#3b82f6','#16a37a','#8b6cf0','#111'],P=[...Array(140)].map(()=>({x:Math.random()*W,y:-Math.random()*H*.6,vy:2+Math.random()*3,vx:-1+Math.random()*2,r:Math.random()*6,vr:-.1+Math.random()*.2,c:cols[Math.random()*5|0]}));const t0=performance.now();
 (function s(n){x.clearRect(0,0,W,H);P.forEach(p=>{p.y+=p.vy*devicePixelRatio;p.x+=p.vx;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-3,-7,5,14);x.restore()});if(n-t0<4500)requestAnimationFrame(s);else x.clearRect(0,0,W,H)})(t0)}
function go(d){window.__d=d;draw(d)}
if(Q.get('confetti'))setTimeout(confetti,500);
const es=new EventSource('/events');es.onmessage=e=>go(JSON.parse(e.data));
</script></body></html>
